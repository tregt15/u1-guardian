[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "u1-guardian"
version = "0.0.1"
description = "Diagnostic tool and failure black box for the Snapmaker U1 3D printer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "platformdirs>=4.0",
    "websockets>=12.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Screenshot and poster tools in tools/marketing. Then run: python -m playwright install chromium
marketing = [
    "playwright>=1.45",
    "pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guardian = ["storage/schema.sql", "web/*", "camera/default_calibration.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ffmpeg: needs FFmpeg and ffprobe on PATH",
    "slow: takes a while (real-time capture)",
]
